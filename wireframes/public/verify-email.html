<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — FieldMax</title>
    <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

    <div class="wf-centered-card">
        <div class="wf-card" style="width:400px;">
            <h1 class="wf-page-title wf-text-center">Verify Your Email</h1>
            <p class="wf-page-subtitle wf-text-center wf-mb-24">
                We've sent a 6-digit code to <strong>user@email.com</strong>
            </p>

            <div class="wf-input wf-text-center wf-mb-16" style="font-size:2rem;letter-spacing:0.5em;height:52px;font-family:monospace;">
                123456
            </div>

            <div class="wf-btn primary wf-mb-16" style="width:100%;justify-content:center;">Verify Email</div>

            <p class="wf-text-center" style="font-size:13px;color:#999;">
                Didn't receive a code? <a href="#" style="color:#37474f;font-weight:600;">Resend code</a>
            </p>
        </div>
    </div>

</body>
</html>
