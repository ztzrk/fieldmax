<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — FieldMax</title>
    <link rel="stylesheet" href="../wireframe.css">
</head>
<body class="wf-page">

    <div class="wf-centered-card">
        <h1 class="wf-page-title wf-text-center">[Verify Your Email]</h1>
        <p class="wf-page-subtitle wf-text-center wf-mb-24">[We sent a verification code to user@email.com]</p>

        <input
            type="text"
            class="wf-input wf-text-center wf-mb-16"
            placeholder="[------]"
            maxlength="6"
            style="font-size: 2rem; letter-spacing: 0.5em; text-align: center;"
        >

        <button class="wf-btn primary wf-mb-16" style="width:100%;">[Verify Email]</button>

        <p class="wf-text-center">
            <a href="#">[Didn't receive a code? Resend code]</a>
        </p>
    </div>

</body>
</html>
