<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldMax - Forgot Password</title>
<link rel="stylesheet" href="../wireframe.css">
</head>
<body>
<div class="wf-centered-card">
  <div class="wf-card" style="width:380px;">
    <h1 class="wf-page-title">Forgot Password?</h1>
    <p class="wf-page-subtitle wf-mb-24">[Enter your email address and we'll send you a link to reset your password.]</p>

    <div class="wf-mb-24">
      <div class="wf-label">Email</div>
      <div class="wf-input">[you@example.com]</div>
    </div>

    <div class="wf-btn primary" style="width:100%;justify-content:center;">Reset Password</div>

    <a href="#" class="wf-back-link wf-mt-16 wf-text-center" style="display:block;">← Back to Login</a>
  </div>
</div>
</body>
</html>
