services:
  - type: web
    name: fieldmax-backend
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fieldmax/shared build && pnpm --filter fieldmax-backend exec prisma generate && pnpm --filter fieldmax-backend build
    startCommand: pnpm --filter fieldmax-backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"FieldMax" <no-reply@fieldmax.com>'
