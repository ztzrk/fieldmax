<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="card-shadow" x="-8%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 Z" fill="#E11D48"/>
    </marker>
  </defs>
  <!-- Background Canvas -->
  <rect x="0" y="0" width="980" height="680" fill="#FFFFFF" rx="16"/>
  <rect x="8" y="8" width="964" height="664" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>
  <!-- Decorative Header -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="4" height="22" rx="2" fill="#2563EB"/>
    <text x="14" y="16" font-size="15" font-weight="bold" fill="#0F172A" letter-spacing="0.2">Tahapan Metode Waterfall (Classic SDLC with Feedback Loops)</text>
  </g>
  <!-- Forward Connectors -->
  <path d="M 170 160 L 170 218 Q 170 230 182 230 L 198 230" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forward)"/>
  <path d="M 310 275 L 310 333 Q 310 345 322 345 L 338 345" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forward)"/>
  <path d="M 450 390 L 450 448 Q 450 460 462 460 L 478 460" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forward)"/>
  <path d="M 590 505 L 590 563 Q 590 575 602 575 L 618 575" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forward)"/>
  <!-- Feedback / Iteration Rail -->
  <path d="M 840 575 L 888 575 Q 900 575 900 563 L 900 127 Q 900 115 888 115 L 284 115" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="900" y1="115" x2="284" y2="115" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <line x1="900" y1="230" x2="424" y2="230" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <line x1="900" y1="345" x2="564" y2="345" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <line x1="900" y1="460" x2="704" y2="460" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
  <!-- Feedback Rail Label -->
  <g transform="translate(892, 330) rotate(-90)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#E11D48">Umpan Balik / Iterasi Perbaikan</text>
  </g>
  <!-- Phase Cards -->
  <g id="phase-01">
    <rect x="60" y="70" width="220" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" filter="url(#card-shadow)"/>
    <path d="M 60 80 Q 60 70 70 70 L 72 70 L 72 160 L 70 160 Q 60 160 60 150 Z" fill="#3B82F6"/>
    <circle cx="90" cy="96" r="14" fill="#2563EB" filter="url(#glow-badge)"/>
    <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">01</text>
    <text x="114" y="95" font-size="14" font-weight="bold" fill="#1E3A8A">Requirement</text>
    <text x="114" y="110" font-size="11" font-weight="600" fill="#3B82F6">Analisis Kebutuhan</text>
    <line x1="82" y1="120" x2="264" y2="120" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="84" y="138" font-size="10.5" fill="#475569">Spesifikasi & analisis kebutuhan</text>
  </g>
  <g id="phase-02">
    <rect x="200" y="185" width="220" height="90" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8" filter="url(#card-shadow)"/>
    <path d="M 200 195 Q 200 185 210 185 L 212 185 L 212 275 L 210 275 Q 200 275 200 265 Z" fill="#14B8A6"/>
    <circle cx="230" cy="211" r="14" fill="#0D9488" filter="url(#glow-badge)"/>
    <text x="230" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">02</text>
    <text x="254" y="210" font-size="14" font-weight="bold" fill="#134E4A">Design</text>
    <text x="254" y="225" font-size="11" font-weight="600" fill="#0D9488">Perancangan Sistem</text>
    <line x1="222" y1="235" x2="404" y2="235" stroke="#14B8A6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="224" y="253" font-size="10.5" fill="#475569">Arsitektur, UML, ERD & UI/UX</text>
  </g>
  <g id="phase-03">
    <rect x="340" y="300" width="220" height="90" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" filter="url(#card-shadow)"/>
    <path d="M 340 310 Q 340 300 350 300 L 352 300 L 352 390 L 350 390 Q 340 390 340 380 Z" fill="#F59E0B"/>
    <circle cx="370" cy="326" r="14" fill="#D97706" filter="url(#glow-badge)"/>
    <text x="370" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">03</text>
    <text x="394" y="325" font-size="14" font-weight="bold" fill="#78350F">Implementation</text>
    <text x="394" y="340" font-size="11" font-weight="600" fill="#B45309">Implementasi Kode</text>
    <line x1="362" y1="350" x2="544" y2="350" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="364" y="368" font-size="10.5" fill="#475569">Pengkodean sistem & basis data</text>
  </g>
  <g id="phase-04">
    <rect x="480" y="415" width="220" height="90" rx="10" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.8" filter="url(#card-shadow)"/>
    <path d="M 480 425 Q 480 415 490 415 L 492 415 L 492 505 L 490 505 Q 480 505 480 495 Z" fill="#A855F7"/>
    <circle cx="510" cy="441" r="14" fill="#9333EA" filter="url(#glow-badge)"/>
    <text x="510" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">04</text>
    <text x="534" y="440" font-size="14" font-weight="bold" fill="#581C87">Verification</text>
    <text x="534" y="455" font-size="11" font-weight="600" fill="#7E22CE">Pengujian Sistem</text>
    <line x1="502" y1="465" x2="684" y2="465" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="504" y="483" font-size="10.5" fill="#475569">Black Box Testing & validasi</text>
  </g>
  <g id="phase-05">
    <rect x="620" y="530" width="220" height="90" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" filter="url(#card-shadow)"/>
    <path d="M 620 540 Q 620 530 630 530 L 632 530 L 632 620 L 630 620 Q 620 620 620 610 Z" fill="#10B981"/>
    <circle cx="650" cy="556" r="14" fill="#059669" filter="url(#glow-badge)"/>
    <text x="650" y="560" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">05</text>
    <text x="674" y="555" font-size="14" font-weight="bold" fill="#064E3B">Maintenance</text>
    <text x="674" y="570" font-size="11" font-weight="600" fill="#047857">Pemeliharaan</text>
    <line x1="642" y1="580" x2="824" y2="580" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="644" y="598" font-size="10.5" fill="#475569">Monitoring, perbaikan & update</text>
  </g>
  <!-- Legend -->
  <g transform="translate(60, 638)">
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="16" y1="14" x2="42" y2="14" stroke="#334155" stroke-width="2" marker-end="url(#arrow-forward)"/>
    <text x="50" y="18" font-size="10.5" font-weight="bold" fill="#334155">Alur Pengembangan Utama</text>
    <line x1="210" y1="14" x2="236" y2="14" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-feedback)"/>
    <text x="244" y="18" font-size="10.5" font-weight="bold" fill="#E11D48">Umpan Balik / Verifikasi</text>
  </g>
</svg>