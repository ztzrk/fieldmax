<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Node A: Mulai -->
  <rect x="110" y="20" width="200" height="60" rx="30" ry="30" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="210" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Mulai</text>

  <!-- Node B: Requirements -->
  <rect x="110" y="130" width="200" height="70" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="210" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Requirements</text>
  <text x="210" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Analisis Kebutuhan</text>

  <!-- Node C: Design -->
  <rect x="110" y="250" width="200" height="70" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="210" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Design</text>
  <text x="210" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Perancangan Sistem</text>

  <!-- Node D: Implementation -->
  <rect x="110" y="370" width="200" height="70" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="210" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Implementation</text>
  <text x="210" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Implementasi</text>

  <!-- Node E: Testing (diamond) -->
  <polygon points="210,490 310,540 210,590 110,540" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="210" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Testing</text>
  <text x="210" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Memenuhi?</text>

  <!-- Node F: Hasil Penelitian -->
  <rect x="110" y="640" width="200" height="70" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="210" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Hasil Penelitian</text>
  <text x="210" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">&amp; Kesimpulan</text>

  <!-- Node G: Selesai -->
  <rect x="110" y="760" width="200" height="60" rx="30" ry="30" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="210" y="796" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Selesai</text>

  <!-- Edge A -> B -->
  <line x1="210" x2="210" y1="80" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge B -> C -->
  <line x1="210" x2="210" y1="200" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge C -> D -->
  <line x1="210" x2="210" y1="320" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge D -> E -->
  <line x1="210" x2="210" y1="440" y2="490" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge E -> F (Ya) -->
  <line x1="210" x2="210" y1="590" y2="640" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="620" font-family="Arial, sans-serif" font-size="13" fill="#333">Ya</text>

  <!-- Edge F -> G -->
  <line x1="210" x2="210" y1="710" y2="760" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge E -> B (Feedback loop: Tidak / Umpan Balik) -->
  <path d="M 110 540 L 20 540 L 20 165 L 110 165" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="30" y="355" font-family="Arial, sans-serif" font-size="12" fill="#555" transform="rotate(-90, 30, 355)">Tidak / Umpan Balik</text>
</svg>
